<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Presentazioni e risorse didattiche interattive di Andrea Accordino.">
  <title>Didattica — Andrea Accordino</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f8fafc; color: #172233; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: white; border-bottom: 1px solid #e2e8f0; padding: 1.15rem max(1.5rem, calc((100vw - 980px)/2)); }
    header a { text-decoration: none; color: inherit; font-weight: 750; letter-spacing: -.025em; }
    main { max-width: 980px; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-size: clamp(2rem, 5vw, 3.1rem); letter-spacing: -.045em; margin: 0 0 .5rem; }
    p { color: #475569; line-height: 1.6; }
    .catalog { margin-top: 2rem; display: grid; gap: 14px; }
    .catalog-card { display: block; padding: 22px 24px; background: #fff; color: inherit; border: 1px solid #dfe5eb; border-radius: 14px; text-decoration: none; transition: border-color .15s; }
    .catalog-card:hover, .catalog-card:focus-visible { border-color: #007b8d; }
    .catalog-card h2 { font-size: 1.12rem; letter-spacing: -.02em; margin: 0 0 6px; }
    .catalog-card p { font-size: .9rem; margin: 0; }
    .catalog-card:focus-visible { outline: 3px solid #007b8d; outline-offset: 3px; }
    footer { max-width: 980px; margin: 0 auto; padding: 2rem 1.5rem; color: #64748b; font-size: .85rem; }
  </style>
</head>
<body>
  <header><a href="/">Didattica</a></header>
  <main>
    <h1>Materiali didattici</h1>
    <p>Presentazioni e attività interattive, liberamente consultabili.</p>
    <section class="catalog" id="catalog" aria-label="Catalogo delle presentazioni">
      <a class="catalog-card" href="/interno-pc/"><h2>Interno del PC: CPU, memorie e motherboard</h2><p>Presentazione didattica · Informatica</p></a>
    </section>
  </main>
  <footer>Andrea Accordino</footer>
  <script>
    /* I file dei materiali non richiedono rebuild: basta aggiornare catalog.json nello stesso commit. */
    fetch('/catalog.json', {cache: 'no-store'})
      .then(response => { if (!response.ok) throw Error('Catalogo non disponibile'); return response.json(); })
      .then(data => {
        if (data.schemaVersion !== 1 || !Array.isArray(data.materials)) return;
        const section = document.getElementById('catalog');
        const cards = data.materials
          .filter(item => item && /^[a-z][a-z0-9-]{0,79}$/.test(item.id)
            && typeof item.title === 'string' && item.title.length < 200)
          .map(item => {
            const link = document.createElement('a');
            link.className = 'catalog-card';
            link.href = '/' + item.id + '/';
            const h = document.createElement('h2');
            h.textContent = item.title;
            const p = document.createElement('p');
            p.textContent = typeof item.description === 'string' ? item.description : 'Presentazione didattica';
            link.append(h, p);
            return link;
          });
        if (cards.length) section.replaceChildren(...cards);
      })
      .catch(() => { /* Il catalogo statico resta disponibile. */ });
  </script>
</body>
</html>
